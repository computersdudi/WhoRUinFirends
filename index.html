<title>מי אתה ב-Friends?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 40%, #6c5ce7 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #333;
  }
  .container {
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    max-width: 650px;
    width: 100%;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
    color: white;
    padding: 30px 20px;
    text-align: center;
  }
  .header h1 { font-size: 2rem; margin-bottom: 8px; }
  .header p { opacity: 0.95; font-size: 1.1rem; }
  .progress-bar { height: 8px; background: #eee; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00cec9 0%, #0984e3 100%);
    width: 0%;
    transition: width 0.4s ease;
  }
  .content { padding: 30px 25px; }
  .question { font-size: 1.35rem; font-weight: 600; margin-bottom: 25px; line-height: 1.5; }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    background: #f0f7ff;
    border: 2px solid #d6e4ff;
    border-radius: 16px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1.05rem;
  }
  .option:hover {
    border-color: #0984e3;
    background: #e6f2ff;
    transform: translateY(-2px);
  }
  .option.selected {
    border-color: #0984e3;
    background: #0984e3;
    color: white;
  }
  .btn {
    background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-size: 1.1rem;
    cursor: pointer;
    margin-top: 20px;
    width: 100%;
    font-weight: 600;
    transition: transform 0.2s;
  }
  .btn:hover { transform: scale(1.03); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: linear-gradient(135deg, #00cec9 0%, #0984e3 100%);
    margin-top: 10px;
    font-size: 0.95rem;
    padding: 10px 24px;
  }
  .result { text-align: center; padding: 10px 0; }
  .result h2 {
    font-size: 2.2rem;
    background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 15px;
  }
  .traits {
    background: #f0f7ff;
    border-radius: 16px;
    padding: 20px;
    margin: 20px 0;
    text-align: right;
  }
  .traits li {
    padding: 8px 0;
    border-bottom: 1px solid #d6e4ff;
    font-size: 1.05rem;
  }
  .traits li:last-child { border: none; }
  .restart { background: linear-gradient(135deg, #00cec9 0%, #0984e3 100%); }
  .question-num { color: #0984e3; font-weight: 700; margin-bottom: 10px; font-size: 0.95rem; }
  .start-screen { text-align: center; }
  .start-screen h2 { margin-bottom: 10px; color: #333; }
  .characters-list {
    background: #f0f7ff;
    border-radius: 16px;
    padding: 15px 20px;
    margin: 20px 0;
    font-size: 1.05rem;
    line-height: 1.7;
  }
  .behind-scenes { text-align: right; max-height: 70vh; overflow-y: auto; }
  .behind-scenes h3 { margin: 15px 0 8px; color: #0984e3; }
  .behind-scenes p { margin: 4px 0; font-size: 0.98rem; }
  .friends-image {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 16px;
    margin: 15px 0;
  }
  .credit {
    font-size: 0.85rem;
    color: #666;
    margin-top: 15px;
    font-style: italic;
  }
</style>
</head>

        <strong>הדמויות בשעשועון:</strong><br>
        ${charNames}

function startQuiz() {
  current = 0;
  Object.keys(characters).forEach(c => scores[c] = 0);
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const progress = (current / questions.length) * 100;
  document.getElementById('progress').style.width = progress + '%';

  let html = `
    <div class="question-num">שאלה ${current + 1} מתוך ${questions.length}</div>
    <div class="question">${q.q}</div>
    <div class="options">
  `;
  q.options.forEach((opt, i) => {
    html += `<div class="option" data-index="${i}">${opt.text}</div>`;
  });
  html += `</div><button class="btn" id="nextBtn" disabled>המשך</button>`;

  document.getElementById('quiz-content').innerHTML = html;

  document.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    const selected = document.querySelector('.option.selected');
    if (!selected) return;
    const idx = parseInt(selected.dataset.index);
    const selectedScores = q.options[idx].scores;
    for (let char in selectedScores) {
      scores[char] += selectedScores[char];
    }
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  });
}

function showResult() {
  document.getElementById('progress').style.width = '100%';
  let maxScore = -1;
  let winner = "";
  for (let char in scores) {
    if (scores[char] > maxScore) {
      maxScore = scores[char];
      winner = char;
    }
  }
  const traits = characters[winner];
  let traitsHtml = traits.map(t => `<li>${t}</li>`).join('');

  document.getElementById('quiz-content').innerHTML = `
    <div class="result">
      <h2>אתה ${winner}!</h2>
      <p style="font-size:1.15rem; margin-bottom:15px;">הדמות מ-Friends שהכי מתאימה לך לפי התשובות שלך</p>
      <div class="traits">
        <strong>התכונות שבגללן נבחרת:</strong>
        <ul style="list-style:none; margin-top:10px;">${traitsHtml}</ul>
      </div>
      <button class="btn btn-secondary" onclick="showBehindScenes()">מאחורי הקלעים – סיבות הניקוד</button>
      <button class="btn restart" onclick="location.reload()">שחק שוב</button>
    </div>
  `;
}

function showBehindScenes() {
  let html = '<div class="behind-scenes"><h2 style="text-align:center; margin-bottom:20px;">מאחורי הקלעים</h2>';
  questions.forEach((q, qi) => {
    html += `<h3>שאלה ${qi + 1}: ${q.q}</h3>`;
    q.options.forEach(opt => {
      let scoreStr = Object.entries(opt.scores).map(([char, pts]) => `${char} (${pts})`).join(", ");
      html += `<p><strong>${opt.text}</strong><br>→ ${scoreStr}</p>`;
    });
  });
  html += '<button class="btn" onclick="showResult()" style="margin-top:20px;">חזרה לתוצאה</button></div>';
  document.getElementById('quiz-content').innerHTML = html;
}

showStartScreen();
</script>
